    <title>page-mascot · a character for the top of your page</title>

      name="description"
      content="A React mascot that follows the reader's cursor and blinks when they poke it. Fifty-two characters are drawn already, and an agent skill draws new ones, or one that looks like you."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf9f7" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var color = dark ? '#141210' : '#faf9f7'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', color)
        } catch (e) {}
      })()
    </script>
